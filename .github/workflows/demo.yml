name: Testujemy github

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: echo 123 > test.html

      - uses: actions/upload-artifact@v4
        with:
          name: test-artifact
          path: test.html

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-artifact

      - run: test -f test.html
